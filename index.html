<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Europa – pluggmeny</title>

    <!-- Gulligare font (som i kawaii-stil) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">
</head>

<body>
<div class="wrap">
    <div class="card">
        <header class="topHeader">
            <div class="userSelectWrap">
                <button class="userSelectBtn" id="userSelectBtn">
                    👤 Välj användare
                </button>

                <div class="userDropdown hidden" id="userDropdown">
                    <button data-user="Elsa">Elsa ❄️</button>
                    <button data-user="Ingrid">Ingrid 🌼</button>
                    <button data-user="Elektra">Elektra 🙂</button>
                </div>
            </div>
        </header>
        <h1>Hej och välkommen</h1>
        <p class="sub">Välj vad du vill träna på idag 🌍✨</p>

        <div class="btnRow">
            <a class="btn primary" href="huvudstader.html">Huvudstäder</a>
            <a class="btn primary" href="instudering.html">Instuderingsfrågor</a>
            <a class="btn primary" href="https://www.geoguessr.com/sv/vgp/3007" target="_blank" rel="noopener">Seterra</a>
        </div>

        <div class="hint">Seterra öppnas i ny flik.</div>

        <div class="catsWrap">
            <img class="cats" src="images/kawaii_cats.png" alt="Kawaii-djur" />
        </div>
    </div>
</div>
<script>
    const USER_KEY = "capquiz_current_user_v3";

    const btn = document.getElementById("userSelectBtn");
    const dropdown = document.getElementById("userDropdown");

    btn.addEventListener("click", () => {
        dropdown.classList.toggle("hidden");
    });

    dropdown.addEventListener("click", (e) => {
        const user = e.target.dataset.user;
        if(!user) return;

        localStorage.setItem(USER_KEY, user);
        btn.textContent = "👤 " + user;
        dropdown.classList.add("hidden");
    });

    // Visa sparad användare direkt
    const savedUser = localStorage.getItem(USER_KEY);
    if(savedUser){
        btn.textContent = "👤 " + savedUser;
    }
</script>
</body>
</html>
