<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Engelska – Moduler</title>


    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/header.css">
</head>

<body>

<div class="wrap">
    <header id="app-header"></header>
    <div class="card">
        <h1>Engelska</h1>
        <p class="sub">Träna på glosor 🌍✨</p>

        <div class="btnRow" id="modulesContainer">
            <!-- Moduler läses in dynamiskt här -->
        </div>

        <div id="no-exam-view" class="hidden" style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 60px; margin-bottom: 10px;">🎉</div>
            <h2 style="margin: 0; color: var(--text);">Inga glosor valda!</h2>
            <p style="margin: 10px 0 0; color: var(--muted); font-size: 18px;">Välj en vecka i listan ovan för att plugga.</p>
        </div>

        <!-- Mobile-only version selector container -->
        <div id="mobileVersionSelector" class="mobile-version-selector"></div>

        <div class="hint">Träna på veckovisa glosor på engelska.</div>

        <div class="catsWrap">
            <img class="cats" src="../images/kawaii_cats.png" alt="Kawaii-djur" />
        </div>
    </div>
    <div class="copyright">&copy; Lisa Norén 2026</div>
</div>

<script src="../js/shared.js"></script>
<script src="../js/header.js"></script>
<script src="js/index.js"></script>
</body>
</html>
