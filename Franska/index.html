<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Franska – Moduler</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/index.css">
    <style>
        .backBtn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: 800;
            color: var(--text);
            background: rgba(255,255,255,.55);
            border: 2px solid rgba(0,0,0,.08);
            padding: 12px 18px;
            border-radius: 999px;
            box-shadow: 0 8px 16px rgba(0,0,0,.10);
            transition: transform .10s ease, background .12s ease, box-shadow .12s ease;
            font-size: 16px;
        }
        .backBtn:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.75);
            box-shadow: 0 12px 22px rgba(0,0,0,.12);
        }
        .backBtn:active {
            transform: translateY(0px);
        }
    </style>
</head>

<body>

<div class="wrap">
    <div class="card">
        <div style="margin-bottom: 20px;">
            <a class="backBtn" href="../index.html">← Till startsidan</a>
        </div>

        <h1>Franska</h1>
        <p class="sub">Innehåll kommer snart 🚀</p>

        <div class="btnRow">
            <p style="color: var(--muted); text-align: center; width: 100%;">
                Moduler för franska kommer att läggas till här.
            </p>
        </div>

        <div class="catsWrap">
            <img class="cats" src="../images/kawaii_cats.png" alt="Kawaii-djur" />
        </div>
    </div>
</div>

</body>
</html>
