<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Franska – Moduler</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/header.css">
</head>

<body>

<div class="wrap">
    <header id="app-header"></header>
    <div class="card">
        <h1>Franska</h1>
        <p class="sub" id="introSubtitle">Välj hur du vill träna din franska 🇫🇷✨</p>

        <div class="btnRow" id="modulesContainer">
            <!-- Moduler läses in dynamiskt här -->
        </div>

        <div id="instructionsContainer" style="text-align: left; max-width: 600px; margin: 0 auto 20px;"></div>

        <div id="no-exam-view" class="hidden" style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 60px; margin-bottom: 10px;">🎉</div>
            <h2 style="margin: 0; color: var(--text);">Inget prov i sikte!</h2>
            <p style="margin: 10px 0 0; color: var(--muted); font-size: 18px;">Just nu finns det inget aktivt prov att plugga på. Ta det lugnt!</p>
        </div>

        <!-- Mobile-only version selector container -->
        <div id="mobileVersionSelector" class="mobile-version-selector"></div>

        <div class="hint" id="introHint">Träna på franska glosor och grammatik.</div>

        <div class="catsWrap">
            <img class="cats" src="../images/kawaii_cats.png" alt="Kawaii-djur" />
        </div>
    </div>
    <div class="copyright">&copy; Lisa Norén 2026</div>
</div>

<script src="../js/shared.js"></script>
<script src="../js/header.js"></script>
<script src="js/index.js"></script>
</body>
</html>
